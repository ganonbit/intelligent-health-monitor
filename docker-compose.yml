version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # AI Provider API Keys (pass through from host environment)
      - OPENAI_AI_API_KEY=${OPENAI_AI_API_KEY}
      - ANTHROPIC_AI_API_KEY=${ANTHROPIC_AI_API_KEY}
      - GEMINI_AI_API_KEY=${GEMINI_AI_API_KEY}
      # Model Configuration
      - ANOMALY_MODEL=${ANOMALY_MODEL:-openai:gpt-4o-mini}
      - ROOT_CAUSE_MODEL=${ROOT_CAUSE_MODEL:-openai:gpt-4o}
      # Application Configuration
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hvac_network

networks:
  hvac_network:
    driver: bridge
