[mypy]
# Python version
python_version = 3.13

# Strict mode (industry standard for new projects)
strict = True

# Import discovery
namespace_packages = True
explicit_package_bases = False

# Warnings
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
warn_return_any = True
warn_unreachable = True

# Error messages
show_error_codes = True
show_column_numbers = True
pretty = True

# Pydantic plugin (critical for Pydantic projects)
plugins = pydantic.mypy

# Pydantic plugin configuration
[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
warn_untyped_fields = True

# Test files - relaxed but still type-checked
# Note: Tests are excluded from mypy checking in pre-commit config
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
disable_error_code =
    no-any-unimported,
    no-untyped-def,
    attr-defined,
    no-any-return

# Relax strict literal checking for pydantic-ai Agent model names
# The Agent class has strict Literal types for model names, but we use dynamic config
# Apply to all services that use Pydantic AI agents
[mypy-core.services.*]
disable_error_code = call-overload,no-any-return

# Common Pydantic quirks and third-party integrations
[mypy-pydantic_ai.*]
# Pydantic AI has complex generic types that can confuse mypy
disable_error_code = type-arg,no-any-return,attr-defined,call-arg

[mypy-pydantic.dataclasses]
# Pydantic dataclasses use dynamic metaclasses
disable_error_code = misc

[mypy-pydantic.functional_validators]
# Validators use complex decorators
disable_error_code = misc

[mypy-api.*]
# FastAPI decorators are not fully typed, so we need to relax decorator checking
disallow_untyped_decorators = False
disable_error_code =
    no-any-unimported,
    no-untyped-def,
    misc
